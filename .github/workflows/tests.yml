name: Reproduction checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,hpc-test]'
      - name: Test analysis and calibration code
        run: python scripts/test_all.py --megaearth
      - name: Verify saved global scores
        run: python hpc/check_global_results.py
